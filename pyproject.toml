[project]
name = "context-garbage-collector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["litellm", "python-dotenv", "pandas", "matplotlib", "tabulate"]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "hypothesis"]
adk = ["google-adk"]

[tool.setuptools]
packages = ["cgc", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Each module runs its sweep once; loadscope keeps a module on one worker so the sweep is not repeated.
addopts = "-n 4 --dist loadscope"
